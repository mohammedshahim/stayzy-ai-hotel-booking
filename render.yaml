services:
  - type: web
    name: stayzy-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: AGENT_BASE_URL
        sync: false
      - key: BOOKING_EXPIRY_MINUTES
        sync: false
      - key: GEOCODING_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: INTERNAL_RATE_LIMIT_MAX
        sync: false
      - key: INTERNAL_RATE_LIMIT_WINDOW_MS
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_ADMIN_SECRET
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false

  - type: web
    name: stayzy-agent
    runtime: python
    region: singapore
    plan: free
    rootDir: agent
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - agent/**
    envVars:
      - key: PYTHON_VERSION
        sync: false
      - key: CHECKPOINTER_SCHEMA
        sync: false
      - key: BACKEND_INTERNAL_URL
        sync: false
      - key: OPENROUTER_BASE_URL
        sync: false
      - key: OPENROUTER_MODEL_FAST
        sync: false
      - key: OPENROUTER_MODEL_SMART
        sync: false
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_ENDPOINT
        sync: false
      - key: LANGSMITH_PROJECT
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        fromService:
          type: web
          name: stayzy-api
          envVarKey: INTERNAL_SERVICE_SECRET
      - key: AGENT_DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
